name: Windows build

# Builds the Windows installer for every push to main and every pull request.
# Download it from the run's page, under "Artifacts".
# Pushing a version tag (for example v0.1.0) also publishes it as a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # to publish releases for version tags
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Build the installer
        run: npx tauri build --bundles nsis

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          archive: false # download the .exe itself, not a zip
          if-no-files-found: error

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
